set debug=loader,mm
set term=vt100
set default=0
set timeout=2

menuentry '0 Cix Sky1 on EVB (ACPI)' {
    linux /Image \
        console=ttyAMA2,115200 \
        efi=noruntime \
        earlycon=pl011,0x040d0000 \
        arm-smmu-v3.disable_bypass=0 \
        cma=640M \
        acpi=force splash \
        loglevel=4 \
        pcie_aspm=off \
        resume=PARTUUID=4c3b24d6-6bf4-4073-91f8-0fc9313947a6 noresume root=/dev/nvme0n1p2 rootwait rw
}

